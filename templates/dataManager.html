<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Management & Training Questionnaire</title>
    
    <!-- Central CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <h1 style="color: #0d3b66; text-align: center; margin-bottom: 20px;">
        Data Management & Training Questionnaire
    </h1>

    <form id="dataManagerForm" action="{{ url_for('submit_questionnaire', role_name='Data Manager') }}" method="POST">

        <!-- Hidden Coordinate Fields for GIS Map Plotting -->
        <input type="hidden" id="site_latitude" name="site_latitude">
        <input type="hidden" id="site_longitude" name="site_longitude">
        <input type="hidden" id="site_city" name="site_city">
        <input type="hidden" id="site_country" name="site_country">

        <!-- ================= SITE INFORMATION ================= -->
        <div class="question-card">
            <h2 class="question-label" style="font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">
                Site Information
            </h2>

            <div style="margin-top: 15px;">
                <label class="question-label">Name</label>
                <input type="text" id="siteName" name="site_name" placeholder="Enter Site Name" required>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Official Address</label>
                <textarea id="officialAddress" name="official_address" rows="3" placeholder="Enter Official Address" required></textarea>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Daily Address (if different)</label>
                <textarea id="dailyAddress" name="daily_address" rows="3" placeholder="Enter Daily Address"></textarea>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Street Address for Overnight Mail (if different)</label>
                <textarea id="overnightAddress" name="overnight_address" rows="3" placeholder="Enter Overnight Mail Address"></textarea>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phone_number" placeholder="Enter Phone Number" required>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Fax Number</label>
                <input type="text" id="faxNumber" name="fax_number" placeholder="Enter Fax Number">
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Email Address</label>
                <input type="email" id="emailAddress" name="email_address" placeholder="Enter Email Address" required>
            </div>
        </div>


        <!-- ================= SECTION 1 ================= -->
        <h2 style="color: #0d3b66; margin-top: 20px;">Section 1 - Data Management</h2>

        <div class="question-card">
            <label class="radio-inline">
                <input type="checkbox" name="lab_na" value="NA"> Section N/A
            </label>
        </div>

        <!-- QUESTION 1 -->
        <div class="question-card">
            <label class="question-label">1. Describe the data collection process at the site (i.e. Clinical data flow, how data is collected, who completes CRFs, and, if applicable, who does data entry of eCRFs).</label>
            <textarea name="data_collection_process" rows="4" placeholder="Enter data collection details..."></textarea>
        </div>

        <!-- QUESTION 2 -->
        <div class="question-card">
            <label class="question-label">2. Is the site’s research-specific electronic data management system 21 CFR Part 11 compliant?</label>
            <div class="options-group">
                <label class="radio-inline"><input type="radio" name="part11_compliant" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="part11_compliant" value="No"> No</label>
                <label class="radio-inline"><input type="radio" name="part11_compliant" value="NA"> N/A</label>
                <label class="radio-inline"><input type="radio" name="part11_compliant" value="UNK"> Unknown</label>
            </div>
        </div>

        <!-- QUESTION 3 -->
        <div class="question-card">
            <label class="question-label">3. Who at the site has responsibility for:</label>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px;">A. Overall Clinical Data Management (Name/Title)</label>
                <input type="text" id="cdmResp" name="cdm_responsibility" placeholder="Enter Name/Title">
            </div>

            <div>
                <label style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px;">B. On-site Data Analysis Process (Name/Title)</label>
                <input type="text" id="analysisResp" name="analysis_responsibility" placeholder="Enter Name/Title">
            </div>
        </div>

        <!-- QUESTION 4 -->
        <div class="question-card">
            <label class="question-label">4. Is there a site management group responsible for data review or analysis?</label>
            <div class="options-group">
                <label class="radio-inline"><input type="radio" name="site_group" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="site_group" value="No"> No</label>
                <label class="radio-inline"><input type="radio" name="site_group" value="NA"> N/A</label>
            </div>
        </div>

        <!-- QUESTION 5 -->
        <div class="question-card">
            <label class="question-label">5. Is a Data Coordinating Center (DCC) used for this protocol?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline"><input type="radio" name="dcc" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="dcc" value="No"> No</label>
                <label class="radio-inline"><input type="radio" name="dcc" value="NA"> N/A</label>
            </div>
            
            <div>
                <label style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px;">If Yes, Name:</label>
                <input type="text" id="dccName" name="dcc_name" placeholder="Enter DCC Name">
            </div>
        </div>

        <!-- QUESTION 6 -->
        <div class="question-card">
            <label class="question-label">6. Are hospital/clinic records paper-based or electronic?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline"><input type="checkbox" name="records" value="Paper"> Paper-based</label>
                <label class="radio-inline"><input type="checkbox" name="records" value="Electronic"> Electronic</label>
                <label class="radio-inline"><input type="checkbox" name="records" value="Both"> Both</label>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">
                    A. If electronic or both, describe the medical records system and how records will be provided for CRA review:
                </label>
                <textarea id="electronicDesc" name="electronic_records_desc" rows="3" placeholder="Enter details..."></textarea>
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">
                    B. If paper-based, which records will be available for CRA review?
                </label>
                <div class="options-group" style="margin-top: 4px;">
                    <label class="radio-inline"><input type="checkbox" name="paper_records_available" value="Clinic/Hospital"> Clinic/Hospital</label>
                    <label class="radio-inline"><input type="checkbox" name="paper_records_available" value="Research Chart"> Research Chart</label>
                </div>
            </div>
        </div>

        <!-- QUESTION 7 -->
        <div class="question-card">
            <label class="question-label">7. If electronic information/data is used, describe general security and confidentiality measures.</label>
            <textarea name="security_measures" rows="4" placeholder="Enter security measures..."></textarea>
        </div>

        <!-- QUESTION 8 -->
        <div class="question-card">
            <label class="question-label">8. Are clinic/hospital medical record storage facilities located near the trial site?</label>
            <div class="options-group">
                <label class="radio-inline"><input type="radio" name="storage_facility_location" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="storage_facility_location" value="No"> No</label>
                <label class="radio-inline"><input type="radio" name="storage_facility_location" value="NA"> N/A</label>
            </div>
        </div>

        <!-- QUESTION 9 -->
        <div class="question-card">
            <label class="question-label">9. Which source documents are usually kept in the subject's medical record?</label>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;">
                <label class="radio-inline"><input type="checkbox" name="source_docs" value="Consent"> Consent Document(s)</label>
                <label class="radio-inline"><input type="checkbox" name="source_docs" value="Progress Notes"> Progress Notes</label>
                <label class="radio-inline"><input type="checkbox" name="source_docs" value="Medical History"> Medical History</label>
                <label class="radio-inline"><input type="checkbox" name="source_docs" value="Clinical Reports"> Clinical Reports (Lab, X-ray, ECG)</label>
                <label class="radio-inline"><input type="checkbox" name="source_docs" value="Worksheets"> Study-specific Worksheets</label>
                <label class="radio-inline"><input type="checkbox" name="source_docs" value="Other"> Other</label>
            </div>

            <div>
                <input type="text" name="source_docs_other_spec" placeholder="Specify if 'Other'">
            </div>
        </div>

        <!-- QUESTION 10 -->
        <div class="question-card">
            <label class="question-label">
                10. Describe the adverse event and/or unanticipated problem data flow, including collection, review for causality, relatedness, intensity/grading, who completes the SAE form, related CRFs, and if applicable, data entry into eCRFs.
            </label>
            <textarea name="ae_data_flow" rows="4" placeholder="Enter details..."></textarea>
        </div>

        <!-- QUESTION 11 -->
        <div class="question-card">
            <label class="question-label">11. Does the site have an SAE reporting system?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline"><input type="radio" name="sae_system_exists" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="sae_system_exists" value="No"> No</label>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">
                    If yes, describe who is responsible for notifying the independent safety monitor, IRB, sponsor/NIDCR, and the chain of events:
                </label>
                <input type="text" name="sae_chain_of_events" placeholder="Description">
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">
                    Who has primary and secondary responsibility for reviewing and signing SAE reports?
                </label>
                <div style="display: flex; gap: 12px; margin-top: 6px;">
                    <input type="text" name="sae_resp_primary" placeholder="Primary (Name/Title)">
                    <input type="text" name="sae_resp_secondary" placeholder="Secondary (Name/Title)">
                </div>
            </div>
        </div>

        <!-- QUESTION 12 -->
        <div class="question-card">
            <label class="question-label">12. Describe the site procedures for SAE reconciliation between the safety and clinical databases, if applicable.</label>
            <textarea name="sae_reconciliation" rows="3" placeholder="Enter reconciliation procedures..."></textarea>
        </div>

        <!-- QUESTION 13 -->
        <div class="question-card">
            <label class="question-label">13. Is long-term storage for study records (after study close-out) maintained off-site?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline"><input type="radio" name="offsite_longterm_storage" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="offsite_longterm_storage" value="No"> No</label>
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">If Yes, describe any special procedures for records review:</label>
                <input type="text" name="offsite_storage_review_proc" placeholder="Description">
            </div>
        </div>


        <!-- ================= SECTION 2 ================= -->
        <h2 style="color: #0d3b66; margin-top: 20px;">Section 2 - Training</h2>

        <div class="question-card">
            <label class="radio-inline">
                <input type="checkbox" name="training_na" value="NA"> Section N/A
            </label>
        </div>

        <!-- QUESTION 1 -->
        <div class="question-card">
            <label class="question-label">1. Has the staff received training on ICH, GCP, and applicable regulatory training?</label>
            <div class="options-group">
                <label class="radio-inline"><input type="radio" name="q_training_gcp" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="q_training_gcp" value="No"> No</label>
            </div>
        </div>

        <!-- QUESTION 2 -->
        <div class="question-card">
            <label class="question-label">2. Has the site staff completed the required Human Subjects Protection Training?</label>
            <div class="options-group">
                <label class="radio-inline"><input type="radio" name="q_training_hsp" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="q_training_hsp" value="No"> No</label>
            </div>
        </div>

        <!-- QUESTION 3 -->
        <div class="question-card">
            <label class="question-label">3. Have key site personnel received training on NIDCR Investigator obligations for clinical research?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline"><input type="radio" name="q_training_nidcr" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="q_training_nidcr" value="No"> No</label>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">A. If Yes, how were they trained?</label>
                <div class="options-group" style="margin-top: 4px;">
                    <label class="radio-inline"><input type="checkbox" name="nidcr_training_method" value="Web-cast"> Web-cast</label>
                    <label class="radio-inline"><input type="checkbox" name="nidcr_training_method" value="Investigator Meeting"> Investigator's Meeting</label>
                    <label class="radio-inline"><input type="checkbox" name="nidcr_training_method" value="On-site"> On-site Training</label>
                </div>
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">B. If Yes, when was the training completed?</label>
                <input type="date" id="trainingDate" name="nidcr_training_date">
            </div>
        </div>

        <!-- QUESTION 4 -->
        <div class="question-card">
            <label class="question-label">4. Has the staff identified any additional training needs for site personnel?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline"><input type="radio" name="q_additional_training" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="q_additional_training" value="No"> No</label>
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">A. If Yes, list training needs:</label>
                <textarea name="additional_training_needs" rows="3" placeholder="Enter training needs..."></textarea>
            </div>
        </div>

        <!-- QUESTION 5 -->
        <div class="question-card">
            <label class="question-label">5. Are training records maintained for study staff, both general and study specific?</label>
            <div class="options-group">
                <label class="radio-inline"><input type="radio" name="q_training_records_maintained" value="Yes"> Yes</label>
                <label class="radio-inline"><input type="radio" name="q_training_records_maintained" value="No"> No</label>
            </div>
        </div>

        <!-- ================= SUBMIT BUTTON ================= -->
        <div style="text-align: center; margin: 35px 0;">
            <button type="submit" class="btn-submit" style="width: 100%; max-width: 360px; font-size: 1.05rem; padding: 14px;">
                Submit Questionnaire
            </button>
        </div>

    </form>

    <!-- CONFIRMATION MESSAGE -->
    <div id="confirmationMessage" style="display: none; text-align: center; padding: 30px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 8px; margin-top: 20px;">
        <h2 style="color: #2e7d32; border: none; margin-top: 0;">Questionnaire Submitted Successfully!</h2>
        <p style="color: #388e3c; font-size: 1.1rem;">Thank you. The data manager questionnaire responses have been recorded.</p>
    </div>

</div>

<!-- Auto-Geocoding Script for Address Coordinate Lookup -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("dataManagerForm");
  const addressInput = document.getElementById("officialAddress");

  if (!form || !addressInput) return;

  form.addEventListener("submit", async function(e) {
    const address = addressInput.value.trim();
    if (!address) return;

    // Pause submission to fetch coordinates via OpenStreetMap Nominatim
    e.preventDefault();

    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
      const data = await response.json();

      if (data && data.length > 0) {
        document.getElementById("site_latitude").value = data[0].lat;
        document.getElementById("site_longitude").value = data[0].lon;

        const displayName = data[0].display_name.split(",");
        document.getElementById("site_city").value = displayName[0] ? displayName[0].trim() : "Local Site";
        document.getElementById("site_country").value = displayName[displayName.length - 1] ? displayName[displayName.length - 1].trim() : "USA";
      } else {
        // Fallback coordinates if address lookup yields no direct match
        document.getElementById("site_latitude").value = "29.7604";
        document.getElementById("site_longitude").value = "-95.3698";
        document.getElementById("site_city").value = "Clinical Center";
        document.getElementById("site_country").value = "USA";
      }
    } catch (err) {
      console.warn("Geocoding lookup failed, submitting with fallback coordinates:", err);
      document.getElementById("site_latitude").value = "29.7604";
      document.getElementById("site_longitude").value = "-95.3698";
      document.getElementById("site_city").value = "Clinical Center";
      document.getElementById("site_country").value = "USA";
    } finally {
      // Resume form submit
      form.submit();
    }
  });
});
</script>

</body>
</html>
