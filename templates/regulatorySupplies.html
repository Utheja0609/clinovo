<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Other Regulatory Supplies Questionnaire</title>
    
    <!-- Central CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <h1 style="color: #0d3b66; text-align: center; margin-bottom: 20px;">
        All Other Regulatory Supplies Questionnaire
    </h1>

    <form id="regSuppliesForm" action="{{ url_for('submit_questionnaire', role_name='All Other Regulatory Supplies') }}" method="POST">

        <!-- Hidden Coordinate Fields for GIS Map Plotting -->
        <input type="hidden" id="site_latitude" name="site_latitude">
        <input type="hidden" id="site_longitude" name="site_longitude">
        <input type="hidden" id="site_city" name="site_city">
        <input type="hidden" id="site_country" name="site_country">

        <!-- ================= SITE INFORMATION ================= -->
        <div class="question-card">
            <h2 class="question-label" style="font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">
                Site Information
            </h2>

            <div style="margin-top: 15px;">
                <label class="question-label">Name</label>
                <input type="text" id="siteName" name="site_name" placeholder="Enter Site Name" required>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Official Address</label>
                <textarea id="officialAddress" name="official_address" rows="3" placeholder="Enter Official Address" required></textarea>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Daily Address (if different)</label>
                <textarea id="dailyAddress" name="daily_address" rows="3" placeholder="Enter Daily Address"></textarea>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Street Address for Overnight Mail (if different)</label>
                <textarea id="overnightAddress" name="overnight_address" rows="3" placeholder="Enter Overnight Mail Address"></textarea>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phone_number" placeholder="Enter Phone Number" required>
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Fax Number</label>
                <input type="text" id="faxNumber" name="fax_number" placeholder="Enter Fax Number">
            </div>

            <div style="margin-top: 15px;">
                <label class="question-label">Email Address</label>
                <input type="email" id="emailAddress" name="email_address" placeholder="Enter Email Address" required>
            </div>
        </div>


        <!-- ================= SECTION 1 ================= -->
        <h2 style="color: #0d3b66; margin-top: 20px;">Section 1 - Facilities and Equipment</h2>

        <div class="question-card">
            <label class="radio-inline">
                <input type="checkbox" name="facility_na" value="NA"> Section N/A
            </label>
        </div>

        <!-- Question 1 -->
        <div class="question-card">
            <label class="question-label">1. Is there adequate examination/procedure room space to conduct assessments as specified in the protocol?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="room_space" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="room_space" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 2 -->
        <div class="question-card">
            <label class="question-label">2. Is there access to emergency equipment and facilities?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="emergency_equipment" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="emergency_equipment" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 3 -->
        <div class="question-card">
            <label class="question-label">3. Please describe the site emergency response plan.</label>
            <textarea name="emergency_plan_desc" rows="4" placeholder="Describe the emergency response plan"></textarea>
        </div>

        <!-- Question 4 -->
        <div class="question-card">
            <label class="question-label">4. Are the specific types of clinical equipment needed for this study available and adequately maintained?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="clinical_equipment" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="clinical_equipment" value="No"> No
                </label>
                <label class="radio-inline">
                    <input type="radio" name="clinical_equipment" value="NA"> N/A
                </label>
            </div>
        </div>

        <!-- Question 4a -->
        <div class="question-card">
            <label class="question-label">4a. List the protocol specific clinical equipment available and the maintenance schedule:</label>
            <textarea name="equipment_schedule_desc" rows="4" placeholder="Enter equipment details and maintenance schedule"></textarea>
        </div>

        <!-- Question 5 -->
        <div class="question-card">
            <label class="question-label">5. Does the staff have adequate space for data entry/management?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="data_space" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="data_space" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 6 -->
        <div class="question-card">
            <label class="question-label">6. Is there on-site access to the following equipment for both staff and CRAs?</label>
            <table>
                <thead>
                    <tr>
                        <th style="width: 70%;">Equipment</th>
                        <th style="width: 15%;">Yes</th>
                        <th style="width: 15%;">No</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Telephone</td>
                        <td><input type="radio" name="telephone" value="Yes"></td>
                        <td><input type="radio" name="telephone" value="No"></td>
                    </tr>
                    <tr>
                        <td>Fax Machine</td>
                        <td><input type="radio" name="fax" value="Yes"></td>
                        <td><input type="radio" name="fax" value="No"></td>
                    </tr>
                    <tr>
                        <td>Copier</td>
                        <td><input type="radio" name="copier" value="Yes"></td>
                        <td><input type="radio" name="copier" value="No"></td>
                    </tr>
                    <tr>
                        <td>Computer with Internet Access for eCRF Monitoring / Internet Availability</td>
                        <td><input type="radio" name="internet" value="Yes"></td>
                        <td><input type="radio" name="internet" value="No"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Question 7 -->
        <div class="question-card">
            <label class="question-label">7. Will the CRA have adequate workspace for monitoring activities?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="cra_space" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="cra_space" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 8 -->
        <div class="question-card">
            <label class="question-label">8. Does the site have adequate, secure storage for study records?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="storage" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="storage" value="No"> No
                </label>
                <label class="radio-inline">
                    <input type="radio" name="storage" value="NA"> N/A
                </label>
            </div>
        </div>

        <!-- Question 9 -->
        <div class="question-card">
            <label class="question-label">9. Where are the study source documents and paper CRFs stored during study conduct?</label>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px;">Location of Source Documents</label>
                <input type="text" name="source_doc_location" placeholder="Enter location">
            </div>

            <div>
                <label style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px;">Location of Paper CRFs</label>
                <input type="text" name="paper_crf_location" placeholder="Enter location">
            </div>
        </div>

        <!-- Question 10 -->
        <div class="question-card">
            <label class="question-label">10. Are the source documents, including medical records, paper or electronic?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="checkbox" name="source_type" value="Paper"> Paper
                </label>
                <label class="radio-inline">
                    <input type="checkbox" name="source_type" value="Electronic"> Electronic
                </label>
            </div>
        </div>

        <!-- Question 11 -->
        <div class="question-card">
            <label class="question-label">11. If electronic, will the CRA have access to them?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="cra_access" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="cra_access" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 12 -->
        <div class="question-card">
            <label class="question-label">12. If paper CRFs are being used, are they located off-site, outside the site/clinic?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline">
                    <input type="radio" name="paper_crf" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="paper_crf" value="No"> No
                </label>
                <label class="radio-inline">
                    <input type="radio" name="paper_crf" value="NA"> N/A
                </label>
            </div>

            <div>
                <label style="font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px;">
                    If Yes, describe the frequency and method for transporting the data to the off-site location:
                </label>
                <textarea name="paper_crf_transport_desc" rows="4" placeholder="Enter details here"></textarea>
            </div>
        </div>


        <!-- ================= SECTION 2 ================= -->
        <h2 style="color: #0d3b66; margin-top: 20px;">Section 2 - Training</h2>

        <div class="question-card">
            <label class="radio-inline">
                <input type="checkbox" name="training_na" value="NA"> Section N/A
            </label>
        </div>

        <!-- Question 1 -->
        <div class="question-card">
            <label class="question-label">1. Has the staff received training on ICH, GCP, and applicable regulatory training?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="q13_1" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="q13_1" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 2 -->
        <div class="question-card">
            <label class="question-label">2. Has the site staff completed the required Human Subjects Protection Training?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="q13_2" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="q13_2" value="No"> No
                </label>
            </div>
        </div>

        <!-- Question 3 -->
        <div class="question-card">
            <label class="question-label">3. Have key site personnel received training on NIDCR Investigator obligations for clinical research?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline">
                    <input type="radio" name="q13_3" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="q13_3" value="No"> No
                </label>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">A. If Yes, how were they trained?</label>
                <div class="options-group" style="margin-top: 4px;">
                    <label class="radio-inline">
                        <input type="checkbox" name="q13_3_method" value="Web-cast"> Web-cast
                    </label>
                    <label class="radio-inline">
                        <input type="checkbox" name="q13_3_method" value="Investigator Meeting"> Investigator's Meeting
                    </label>
                    <label class="radio-inline">
                        <input type="checkbox" name="q13_3_method" value="On-site Training"> On-site Training
                    </label>
                </div>
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">B. If Yes, when was the training completed?</label>
                <input type="date" name="q13_3_date">
            </div>
        </div>

        <!-- Question 4 -->
        <div class="question-card">
            <label class="question-label">4. Has the staff identified any additional training needs for site personnel?</label>
            <div class="options-group" style="margin-bottom: 15px;">
                <label class="radio-inline">
                    <input type="radio" name="q13_4" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="q13_4" value="No"> No
                </label>
            </div>

            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">A. If Yes, list training needs:</label>
                <textarea name="q13_4_needs" rows="3" placeholder="Enter training needs"></textarea>
            </div>
        </div>

        <!-- Question 5 -->
        <div class="question-card">
            <label class="question-label">5. Are training records maintained for study staff, both general and study specific?</label>
            <div class="options-group">
                <label class="radio-inline">
                    <input type="radio" name="q13_5" value="Yes"> Yes
                </label>
                <label class="radio-inline">
                    <input type="radio" name="q13_5" value="No"> No
                </label>
            </div>
        </div>

        <!-- ================= SUBMIT BUTTON ================= -->
        <div style="text-align: center; margin: 35px 0;">
            <button type="submit" class="btn-submit" style="width: 100%; max-width: 360px; font-size: 1.05rem; padding: 14px;">
                Submit Questionnaire
            </button>
        </div>

    </form>
</div>

<!-- Auto-Geocoding Script for Address Coordinate Lookup -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("regSuppliesForm");
  const addressInput = document.getElementById("officialAddress");

  if (!form || !addressInput) return;

  form.addEventListener("submit", async function(e) {
    const address = addressInput.value.trim();
    if (!address) return;

    // Pause submission to fetch coordinates via OpenStreetMap Nominatim
    e.preventDefault();

    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
      const data = await response.json();

      if (data && data.length > 0) {
        document.getElementById("site_latitude").value = data[0].lat;
        document.getElementById("site_longitude").value = data[0].lon;

        const displayName = data[0].display_name.split(",");
        document.getElementById("site_city").value = displayName[0] ? displayName[0].trim() : "Local Site";
        document.getElementById("site_country").value = displayName[displayName.length - 1] ? displayName[displayName.length - 1].trim() : "USA";
      } else {
        // Fallback coordinates if address lookup yields no direct match
        document.getElementById("site_latitude").value = "29.7604";
        document.getElementById("site_longitude").value = "-95.3698";
        document.getElementById("site_city").value = "Clinical Center";
        document.getElementById("site_country").value = "USA";
      }
    } catch (err) {
      console.warn("Geocoding lookup failed, submitting with fallback coordinates:", err);
      document.getElementById("site_latitude").value = "29.7604";
      document.getElementById("site_longitude").value = "-95.3698";
      document.getElementById("site_city").value = "Clinical Center";
      document.getElementById("site_country").value = "USA";
    } finally {
      // Resume form submit
      form.submit();
    }
  });
});
</script>

</body>
</html>
